    <title>bodegaeinterapp</title>
    <script>
      // Restore path redirected by 404.html for SPA routing on GitHub Pages
      (function () {
        var p = new URLSearchParams(window.location.search).get('p');
        if (p) {
          window.history.replaceState(null, null, '/' + p);
        }
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

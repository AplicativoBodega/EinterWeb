<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      // Redirect SPA routes to index.html preserving the path as a query param.
      // See: https://github.com/rafgraph/spa-github-pages
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.host + l.pathname.split('/').slice(0, 2).join('/') +
        '/?p=' + encodeURIComponent(l.pathname.slice(1) + l.search) +
        '#' + l.hash.slice(1)
      );
    </script>
  </head>
  <body></body>
</html>
